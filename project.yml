name: ChargeSpeed
options:
  bundleIdPrefix: com.gregwilson
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ChargeSpeed:
    type: application
    platform: iOS
    sources:
      - ChargeSpeed
    # DEVELOPMENT_TEAM lives here so a gitignored Local.xcconfig can override it.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # Writes GitCommit and BuildDate into the built Info.plist (read by BuildInfo.swift), so the
    # app can say which commit it is. Runs every build; code signing happens after it.
    postBuildScripts:
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then commit="$commit-dirty"; fi
          /usr/libexec/PlistBuddy -c "Delete :GitCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $commit" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :BuildDate" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :BuildDate string $(date -u +%Y-%m-%dT%H:%M:%SZ)" "$plist"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gregwilson.chargespeed
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: ChargeSpeed
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ChargeSpeed/ChargeSpeed-Bridging-Header.h
        # The build-info stamp reads .git and writes the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
